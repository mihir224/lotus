name: lotus

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lotus
      POSTGRES_USER: lotus
      POSTGRES_PASSWORD: lotus
    ports:
      - "5432:5432"
    volumes:
      - lotus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus -d lotus"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lotus-postgres:
